services:
  postgres:
    image: postgres:16
    container_name: fyrmma-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: fyrmma
      POSTGRES_PASSWORD: fyrmma_dev
      POSTGRES_DB: fyrmma_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
